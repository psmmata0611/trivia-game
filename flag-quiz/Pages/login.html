<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Flag "THE FLAG"</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide">
    <link rel="stylesheet" type="text/css" href="/css/header.css">
    <link rel="stylesheet" type="text/css" href="/css/logstyles.css">
    <script src="../JS/login.mjs"></script>
</head>

<body>
    <!--Navigation bar-->
    <header>
        <h2 class="title"><a href="../index.html">Flag "THE FLAG"</a> </h2>
        <nav class="topnav">
            <a href="login.html">Login</a>
            <a href="score.html">Score</a>
            <a href="game.html">Game</a>
            <a href="signup.html">Sign up</a>
        </nav>
    </header>

    

    <!--Login form-->
    <div class="wrapper">
        <div class="form-box login">
            <form id="loginForm">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="name" required id="name">
                    <label>name</label>
                    <span id="nameError" class="error-message"></span>
                </div>
                <div class="input-box">
                    <input type="username" required id="username">
                    <label>username</label>
                    <span id="usernameError" class="error-message"></span>
                </div>
                <div class="input-box">
                    <input type="password" required id="password">
                    <label>password</label>
                    <span id="passwordError" class="error-message"></span>
                </div>
                <button type="submit">Login</button>
                <div class="login-register">
                    <p> Don´t have an account? <a href="signup.html" class="signup-link">Sign up</a></p>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
