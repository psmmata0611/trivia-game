<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Sign up | Flag "THE FLAG"</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide">
    <link rel="stylesheet" type="text/css" href="/css/header.css">
    <link rel="stylesheet" type="text/css" href="/css/signupstyles.css">
    <script src="../JS/signup.mjs"></script>
</head>

<body>
    <!--Navigation bar-->
    <header>
        <h2 class="title"><a href="../index.html">Flag "THE FLAG"</a> </h2>
        <nav class="topnav">
            <a href="login.html">Login</a>
            <a href="score.html">Score</a>
            <a href="game.html">Game</a>
            <a href="signup.html">Sign up</a>
        </nav>
    </header>

    <!-- Sign up form-->
    <div class="wrapper">
        <div class="form-box sign-up">
            <h1>Sign-Up</h1>
            <form id="sign-upForm">

                <div class="input-box">
                    <input type="name" required id="name">
                    <label>name</label>
                </div>
                <div class="input-box">
                    <p>date of birth</p>
                    <input type="date" required id="dob">
                    <span id="dobError"></span><br>
                </div>
                <div class="input-box">
                    <input type="username" required id="username">
                    <label>username</label>
                    <span id="usernameError"></span>
                </div>
                <div class="input-box">
                    <input type="new-password" required id="password">
                    <label>password</label>
                    <span id="passwordError"></span>
                </div>
                <div class="input-box">
                    <input type="passwordconf" required id="passwordconf">
                    <label>confirm password</label>
                    <span id="passwordErrorf"></span>
                </div>
                <div class="terms">
                    <label><input type="checkbox" required id="termscond">
                        Agree to the terms & conditions</label>
                </div>
                <button type="submit">Sign-Up </button>
                <div class="login-register">
                    <p> Already have an account? <a href="login.html" class="signup-link">Login</a></p>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
